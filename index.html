<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gina Minzu · doTERRA Wellness Advocate</title>
<meta name="description" content="Contact Gina Minzu, doTERRA Wellness Advocate in Ireland, on WhatsApp or Facebook.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Open+Sans:wght@400;600;700&display=swap">
<style>
/* Soft pink ground, blurred lavender in the top corners, sharp lavender at the bottom, centred purple content: matches Gina's printed card. */
:root{
  --bg-1:#FCF7F9; --bg-2:#F4E7EE;
  --ink:#4A1A5E; --plum:#5B2A73; --violet:#7E3FA6; --lilac:#B48AD6; --lilac-soft:#EFE3F7;
  --muted:#6E5A78; --card:rgba(255,255,255,.82);
  --script:'Great Vibes','Brush Script MT',cursive;
  --sans:'Open Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  position:relative;overflow-x:hidden;min-height:100vh;
  background:radial-gradient(120% 90% at 50% 40%, var(--bg-1) 0%, var(--bg-2) 100%);
  color:var(--ink);font-family:var(--sans);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:48px 64px;
  display:flex;justify-content:center;align-items:flex-start;
}
/* Corner lavender */
.deco{position:absolute;z-index:0;pointer-events:none;height:auto}
.deco.tl{top:-70px;left:-90px;width:360px;transform:rotate(155deg);filter:blur(7px);opacity:.75}
.deco.tr{top:-80px;right:-90px;width:340px;transform:rotate(-150deg) scaleX(-1);filter:blur(8px);opacity:.6}
.deco.bl{bottom:-40px;left:-70px;width:300px;transform:rotate(58deg)}
.deco.br{bottom:-60px;right:-80px;width:250px;transform:rotate(-55deg) scaleX(-1);filter:blur(1.5px);opacity:.9}
.leaf{position:absolute;z-index:0;pointer-events:none;right:24px;bottom:150px;width:120px;height:auto;transform:rotate(-12deg)}
@media (max-width:560px){
  .deco.tl{width:240px;top:-60px;left:-80px}
  .deco.tr{width:220px;top:-60px;right:-80px}
  .deco.bl{width:200px;left:-70px}
  .deco.br{width:170px;right:-70px}
  .leaf{width:80px;bottom:120px;right:8px}
}

main{position:relative;z-index:1;width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:26px;text-align:center}

.brand{display:flex;flex-direction:column;align-items:center;gap:6px}
.logo{width:170px;height:auto;display:block}
.role{margin:0;font-size:18px;font-weight:600;color:var(--violet);letter-spacing:.3px}
.divider{display:flex;align-items:center;gap:10px;width:min(280px,80%);margin-top:6px}
.divider::before,.divider::after{content:"";flex:1;height:1.5px;background:linear-gradient(90deg,transparent,var(--violet))}
.divider::after{background:linear-gradient(90deg,var(--violet),transparent)}
.divider svg{width:12px;height:15px;flex:0 0 auto}

.name-wrap{display:flex;flex-direction:column;align-items:center}
.name{margin:0;font-family:var(--script);font-weight:400;font-size:clamp(60px,17vw,82px);line-height:1;color:var(--plum);text-wrap:balance}
.swash{width:min(300px,78%);height:22px;margin-top:-2px}

.tag{margin:0;font-size:15px;line-height:1.6;color:var(--muted);max-width:34ch}

.links{width:100%;display:flex;flex-direction:column;gap:12px}
.btn{display:flex;align-items:center;gap:16px;padding:14px 18px;border-radius:16px;background:var(--card);
  border:1px solid rgba(126,63,166,.18);color:var(--ink);text-decoration:none;text-align:left;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  box-shadow:0 4px 16px rgba(91,42,115,.08);transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(91,42,115,.16);border-color:var(--lilac)}
.btn:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
.ico{flex:0 0 44px;height:44px;border-radius:50%;background:var(--lilac-soft);display:flex;align-items:center;justify-content:center}
.ico svg{width:22px;height:22px}
.txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.t1{font-weight:700;font-size:16px;color:var(--plum)}
.t2{font-size:13px;color:var(--muted)}
.arrow{margin-left:auto;color:var(--violet);font-size:18px}
.btn.join{background:linear-gradient(135deg,#6A2C8A,#8E4CC0);border-color:transparent;color:#fff}
.btn.join:hover{box-shadow:0 8px 22px rgba(91,42,115,.32)}
.btn.join .ico{background:rgba(255,255,255,.18)}
.btn.join .t1,.btn.join .arrow{color:#fff}
.btn.join .t2{color:#F1E6FA}

.contact{display:flex;align-items:center;gap:14px;padding:4px 0}
.contact .ic{display:flex;align-items:center;justify-content:center;padding-right:14px;border-right:2px solid var(--violet);height:36px}
.contact .ic svg{width:22px;height:22px}
.contact .num{font-size:20px;font-weight:700;color:var(--plum);user-select:all;font-variant-numeric:tabular-nums}

@media (prefers-reduced-motion: reduce){.btn{transition:none}.btn:hover{transform:none}}
</style>
</head>
<body>

<img class="deco tl" src="lavender.svg" alt="" aria-hidden="true">
<img class="deco tr" src="lavender.svg" alt="" aria-hidden="true">
<img class="deco bl" src="lavender.svg" alt="" aria-hidden="true">
<img class="deco br" src="lavender.svg" alt="" aria-hidden="true">

<main>

  <header class="name-wrap">
    <h1 class="name">Gina Minzu</h1>

      <path d="M4 18 C90 2 210 2 296 16" fill="none" stroke="url(#sw)" stroke-width="3" stroke-linecap="round"/>

      <span class="arrow" aria-hidden="true">→</span>
    </a>
    <a class="btn" href="https://www.facebook.com/share/1DTdHgcXXu/?mibextid=wwXIfr" target="_blank" rel="noopener">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="#5B2A73" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h-2.5A3.5 3.5 0 0 0 9 6.5V10H6.5v3.5H9V21h3.5v-7.5H15l.5-3.5h-3V7a1 1 0 0 1 1-1H15z"/></svg></span>
      <span class="txt"><span class="t1">Facebook</span><span class="t2">Follow Gina · Urmărește-o pe Gina</span></span>
      <span class="arrow" aria-hidden="true">→</span>
    </a>
    <!-- JOIN LINK: Gina's doTERRA enrolment page -->
    <a class="btn join" href="https://office.doterra.com/georgetaminzu" target="_blank" rel="noopener">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21v-8"/><path d="M12 13c0-4 3-7 8-7 0 4-3 7-8 7z"/><path d="M12 15c0-3.5-2.5-6-7-6 0 3.5 2.5 6 7 6z"/></svg></span>
      <span class="txt"><span class="t1">Join doTERRA</span><span class="t2">Become a Wellness Advocate · Alătură-te</span></span>
      <span class="arrow" aria-hidden="true">→</span>
    </a>
  </nav>

  <div class="contact">
    <span class="ic"><svg viewBox="0 0 24 24" fill="#7E3FA6" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.6a1 1 0 0 1-.25 1z"/></svg></span>
    <span class="num">+353 87 293 9045</span>
  </div>
</main>

</body>
</html>

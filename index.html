<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gina Minzu · doTERRA Wellness Advocate</title>
<meta name="description" content="Contact Gina Minzu, doTERRA Wellness Advocate in Ireland, on WhatsApp or Facebook.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;500;600&display=swap">
<style>
/* One centred card, like the business card itself: name, title, two contact buttons. Single lavender look by choice. */
:root{
  --bg:#F7F3FA; --card:#FFFFFF; --ink:#2E2838; --muted:#5B5168;
  --plum:#5A4680; --lav:#A992CF; --lav-soft:#E6DDF1; --sage:#7C8F6A; --gold:#B99A5B;
  --script:'Great Vibes', 'Brush Script MT', cursive;
  --sans:'Montserrat', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
body{margin:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:40px;
  display:flex;justify-content:center;align-items:flex-start}
main{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:28px;text-align:center;position:relative}
.sprig{width:90px;height:120px}
.name{margin:0;font-family:var(--script);font-weight:400;font-size:clamp(56px,16vw,72px);line-height:1;color:var(--plum);text-wrap:balance}
.role{margin:10px 0 0;font-size:12px;letter-spacing:5px;font-weight:600;color:var(--ink)}
.brand{margin:6px 0 0;font-size:13px;color:var(--muted)}
.tag{margin:0;font-size:15px;line-height:1.5;color:var(--muted);max-width:32ch}
.links{width:100%;display:flex;flex-direction:column;gap:14px}
.btn{display:flex;align-items:center;gap:16px;padding:16px 20px;border-radius:16px;background:var(--card);
  border:1px solid var(--lav-soft);color:var(--ink);text-decoration:none;text-align:left;
  box-shadow:0 2px 10px rgba(90,70,128,.08);transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(90,70,128,.14);border-color:var(--lav)}
.btn:focus-visible{outline:3px solid var(--plum);outline-offset:3px}
.ico{flex:0 0 44px;height:44px;border-radius:50%;background:var(--lav-soft);display:flex;align-items:center;justify-content:center}
.ico svg{width:22px;height:22px}
.txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.t1{font-weight:600;font-size:16px}
.t2{font-size:13px;color:var(--muted)}
.arrow{margin-left:auto;color:var(--plum)}
.phone{display:flex;flex-direction:column;gap:6px;align-items:center}
.phone .lbl{font-size:11px;letter-spacing:3px;font-weight:600;color:var(--muted)}
.phone .num{font-size:18px;font-weight:500;user-select:all;font-variant-numeric:tabular-nums}
.drops{display:flex;gap:10px;align-items:flex-end}
footer{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){.btn{transition:none}.btn:hover{transform:none}}
</style>

</head>
<body>
<main>
  <svg class="sprig" viewBox="0 0 200 260" aria-hidden="true">
    <g transform="rotate(-14 100 250)">
      <path d="M100 250 C100 190 102 130 100 40" fill="none" stroke="#7C8F6A" stroke-width="3"/>
      <ellipse cx="94" cy="50" rx="7" ry="12" fill="#A992CF" transform="rotate(-20 94 50)"/><ellipse cx="106" cy="66" rx="7" ry="12" fill="#9A82C4" transform="rotate(20 106 66)"/><ellipse cx="94" cy="82" rx="7" ry="12" fill="#B8A3DA" transform="rotate(-20 94 82)"/><ellipse cx="106" cy="98" rx="7" ry="12" fill="#A992CF" transform="rotate(20 106 98)"/><ellipse cx="94" cy="114" rx="6" ry="11" fill="#9A82C4" transform="rotate(-20 94 114)"/><ellipse cx="106" cy="130" rx="6" ry="10" fill="#B8A3DA" transform="rotate(20 106 130)"/>
      <path d="M100 210 C80 200 70 180 72 160 C88 172 96 190 100 210 Z" fill="#9AAB86"/>
    </g>
  </svg>

  <header>
    <h1 class="name">Gina Minzu</h1>
    <p class="role">WELLNESS ADVOCATE</p>
    <p class="brand">doTERRA · Ireland</p>
  </header>

  <p class="tag">Pure essential oils &amp; natural solutions.<br>Uleiuri esențiale pure &amp; soluții naturale.</p>

  <nav class="links" aria-label="Contact Gina">
    <a class="btn" href="https://wa.me/353872939045" target="_blank" rel="noopener">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="#5A4680" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.4A8.5 8.5 0 1 1 21 11.5z"/><path d="M9 9.5c.3 1.6 1.9 3.6 3.9 4.4.5.2 1 0 1.3-.4l.5-.7"/></svg></span>
      <span class="txt"><span class="t1">WhatsApp</span><span class="t2">Send a message · Trimite un mesaj</span></span>
      <span class="arrow" aria-hidden="true">→</span>
    </a>
    <a class="btn" href="https://www.facebook.com/share/1DTdHgcXXu/?mibextid=wwXIfr" target="_blank" rel="noopener">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="#5A4680" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h-2.5A3.5 3.5 0 0 0 9 6.5V10H6.5v3.5H9V21h3.5v-7.5H15l.5-3.5h-3V7a1 1 0 0 1 1-1H15z"/></svg></span>
      <span class="txt"><span class="t1">Facebook</span><span class="t2">Follow Gina · Urmărește-o pe Gina</span></span>
      <span class="arrow" aria-hidden="true">→</span>
    </a>
  </nav>

  <div class="phone">
    <span class="lbl">PHONE · TELEFON</span>
    <span class="num">+353 87 293 9045</span>
  </div>

  <div class="drops" aria-hidden="true">
    <svg viewBox="0 0 60 76" width="12" height="15"><path d="M30 2C30 2 6 32 6 50a24 24 0 0 0 48 0C54 32 30 2 30 2Z" fill="#B8A3DA"/></svg>
    <svg viewBox="0 0 60 76" width="18" height="23"><path d="M30 2C30 2 6 32 6 50a24 24 0 0 0 48 0C54 32 30 2 30 2Z" fill="#A992CF"/></svg>
    <svg viewBox="0 0 60 76" width="12" height="15"><path d="M30 2C30 2 6 32 6 50a24 24 0 0 0 48 0C54 32 30 2 30 2Z" fill="#B99A5B"/></svg>
  </div>
</main>

</body>
</html>
